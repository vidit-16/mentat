    date: "2026-11-17"
    model: "no model (fixed-answer stand-in)"
    status: completed
    input: hostile.jsonl
    raw_path: results/raw/hostile-shell-001/pytest.txt
    description: "Hostile tests against the input handling before any model existed. First attempt did not start (Starlette API change); fixed; 95 passed."
